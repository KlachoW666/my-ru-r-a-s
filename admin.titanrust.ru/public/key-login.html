<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход в панель — TITAN RUST</title>
<!--
  Отдельная страница входа по ключу.

  Собранный фронт админки умеет только passkey, поля для ключа там нет, а
  пересобрать его нельзя — исходников Vue в репозитории не существует.
  Поэтому вход сделан рядом: страница получает токен и кладёт его в
  localStorage под тем же именем, которое читает SPA (admin-token), после
  чего просто уходит на /. Приложение открывается уже авторизованным.

  Бандл при этом не тронут и переживёт любую пересборку.
-->
<style>
  :root {
    --bg: #0a0a0b;
    --card: #141416;
    --line: #26262a;
    --text: #f4f4f5;
    --muted: #8b8b93;
    --accent: #2563eb;
    --accent-hover: #3b7bf0;
    --danger: #f04438;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 380px; }
  .brand {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; margin-bottom: 22px;
  }
  .mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-weight: 800; font-size: 18px; letter-spacing: .5px;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px;
  }
  h2 { margin: 0 0 4px; font-size: 16px; text-align: center; font-weight: 600; }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; text-align: center; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: #0e0e10; color: var(--text);
    font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 14px; padding: 11px;
    border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff;
    font: inherit; font-weight: 600;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .55; cursor: default; }
  .msg {
    margin-top: 14px; padding: 10px 12px; border-radius: 10px;
    font-size: 13px; display: none;
  }
  .msg.err { display: block; background: rgba(240,68,56,.12); color: #ffb4ad; }
  .msg.ok  { display: block; background: rgba(37,99,235,.14); color: #b9ccff; }
  .hint { margin-top: 16px; text-align: center; font-size: 12px; color: var(--muted); }
  .hint code { color: #b9ccff; font-size: 11px; }
  a { color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark">TR</div>
      <h1>TITAN RUST</h1>
    </div>

    <div class="card">
      <h2>Вход в панель</h2>
      <p class="sub">По ключу доступа</p>

      <form id="f" autocomplete="off">
        <label for="key">Ключ доступа</label>
        <input id="key" name="key" type="password" placeholder="trk_…"
               autocomplete="current-password" spellcheck="false" required>
        <button id="btn" type="submit">Войти</button>
      </form>

      <div id="msg" class="msg"></div>

      <p class="hint">
        Ключ выдаёт владелец в разделе «Администраторы».<br>
        Первый создаётся на сервере: <code>node deploy/make-key.js</code>
      </p>
    </div>
  </div>

<script>
  // Имя снято с бандла админки: axios-перехватчик читает токен именно отсюда.
  var TOKEN_KEY = 'admin-token';

  var f = document.getElementById('f');
  var input = document.getElementById('key');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg ' + kind;
  }

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    var key = input.value.trim();
    if (!key) return;

    btn.disabled = true;
    show('Проверяем ключ…', 'ok');

    try {
      var r = await fetch('/api/v1/admin/auth/key/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key })
      });
      var body = await r.json().catch(function () { return {}; });

      if (!r.ok || !body.success || !body.data || !body.data.accessToken) {
        show(body.message || 'Ключ недействителен', 'err');
        btn.disabled = false;
        input.select();
        return;
      }

      localStorage.setItem(TOKEN_KEY, body.data.accessToken);
      var who = body.data.user || {};
      show('Готово: ' + (who.username || 'вход выполнен') + ' · ' + (who.role || ''), 'ok');
      // Небольшая пауза, чтобы человек успел увидеть, под какой ролью вошёл.
      setTimeout(function () { location.replace('/'); }, 600);
    } catch (err) {
      show('Сервер не отвечает', 'err');
      btn.disabled = false;
    }
  });

  input.focus();
</script>
</body>
</html>
