# titanrust.ru — игровой сайт.
#
# Сертификаты проще всего получить certbot'ом, он сам допишет ssl_* строки:
#   sudo certbot --nginx -d titanrust.ru -d www.titanrust.ru

server {
    listen 80;
    listen [::]:80;
    server_name titanrust.ru www.titanrust.ru;

    # ACME-проверку пропускаем как есть, остальное — на HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://titanrust.ru$request_uri; }
}

# www -> голый домен. Разными адресами жить нельзя: PUBLIC_URL уходит в Steam
# как realm, и если игрок пришёл на www, а realm — titanrust.ru, Steam
# откажет в авторизации.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.titanrust.ru;

    # ssl_certificate / ssl_certificate_key допишет certbot
    return 301 https://titanrust.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name titanrust.ru;

    # ssl_certificate / ssl_certificate_key допишет certbot

    # Картинки предметов и кейсов бывают крупными, а админка грузит файлы
    # через этот же домен.
    client_max_body_size 12m;

    access_log /var/log/nginx/titanrust.access.log;
    error_log  /var/log/nginx/titanrust.error.log;

    # WebSocket. Блок обязателен и должен идти ДО location / — без него
    # апгрейд соединения не проходит, и фронт молча уходит в реконнект-цикл.
    location /ws {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;   # иначе соединение рвётся раз в минуту
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Без этого заголовка req.protocol всегда 'http', и refresh-cookie
        # уходит без флага Secure — браузер её не примет, игрока разлогинит
        # сразу после входа через Steam.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
