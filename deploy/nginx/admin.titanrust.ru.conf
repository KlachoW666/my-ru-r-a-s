# admin.titanrust.ru — админка.
#
#   sudo certbot --nginx -d admin.titanrust.ru
#
# Домен обязан совпадать с ADMIN_RP_ID в .env: passkey выпускается на конкретный
# RP ID, и ключ, заведённый на localhost, на этом домене не сработает.

server {
    listen 80;
    listen [::]:80;
    server_name admin.titanrust.ru;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://admin.titanrust.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.titanrust.ru;

    # ssl_certificate / ssl_certificate_key допишет certbot

    # Загрузка картинок кейсов и предметов через админку.
    client_max_body_size 12m;

    access_log /var/log/nginx/titanrust-admin.access.log;
    error_log  /var/log/nginx/titanrust-admin.error.log;

    # Админка — не публичная страница. Если у вас статический адрес, оставьте
    # только его; строки ниже раскомментировать после проверки, иначе можно
    # запереть самого себя.
    # allow 203.0.113.7;
    # deny  all;

    # WebAuthn работает только в защищённом контексте и требует этих заголовков
    # на всём домене, включая /login.html.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "DENY"             always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header Referrer-Policy           "same-origin"      always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
